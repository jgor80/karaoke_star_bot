<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#170d1c">
<title>Oke Night TV</title>
<meta name="description" content="The latest karaoke night's awards and badges, scrolling on a TV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
/* TV screen: landscape, read from across the bar, no interaction. Sizes scale with the screen height (vh)
   so a 720p and a 4K TV show the same layout. The award and badge list scrolls up on a loop. */
:root {
  --bg: #170d1c; --panel: #23152a; --ink: #f6ecf8; --muted: #c7b5ce; --line: #3a2843;
  --hot: #ff5c9d; --hot-soft: #3d1a2c; --gold: #f5b84a; --gold-soft: #3a2a14;
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
  --u: 1vh; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: radial-gradient(120vh 80vh at 85% -10%, #3b1630 0%, transparent 60%), var(--bg); color: var(--ink);
  font-family: var(--f-body); cursor: none; display: grid; grid-template-rows: auto minmax(0, 1fr); }

header { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: calc(3 * var(--u));
  padding: calc(3 * var(--u)) calc(4 * var(--u)) calc(2.4 * var(--u)); border-bottom: 2px solid var(--line); }
.logo { font-family: var(--f-display); font-size: calc(4.6 * var(--u)); color: var(--hot); line-height: 1; white-space: nowrap; }
.logo span { color: var(--gold); }
.title { font-size: calc(5.4 * var(--u)); font-weight: 800; line-height: 1.05; margin-top: calc(1 * var(--u)); overflow-wrap: anywhere; }
.kicker { font-family: var(--f-mono); font-size: calc(2 * var(--u)); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: calc(.8 * var(--u)); }
.kicker.live { color: var(--hot); }
.kicker.live::before { content: ""; display: inline-block; width: calc(1.4 * var(--u)); height: calc(1.4 * var(--u)); border-radius: 50%;
  background: var(--hot); margin-right: calc(1 * var(--u)); vertical-align: calc(.1 * var(--u)); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.tally { display: flex; gap: calc(1.6 * var(--u)); }
.tally div { background: var(--panel); border: 2px solid var(--line); border-radius: calc(1.6 * var(--u)); padding: calc(1.2 * var(--u)) calc(2 * var(--u));
  text-align: center; font-family: var(--f-mono); font-size: calc(1.7 * var(--u)); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-width: calc(13 * var(--u)); }
.tally strong { display: block; font-family: var(--f-display); font-weight: 400; font-size: calc(5 * var(--u)); color: var(--ink); letter-spacing: 0; line-height: 1.1; }
.qr { display: grid; justify-items: center; gap: calc(.6 * var(--u)); }
.qr .code { background: #fff; padding: calc(.8 * var(--u)); border-radius: calc(1 * var(--u)); width: calc(15 * var(--u)); height: calc(15 * var(--u)); }
.qr .code img, .qr .code canvas { width: 100% !important; height: 100% !important; display: block; }
.qr small { font-family: var(--f-mono); font-size: calc(1.7 * var(--u)); color: var(--gold); }

.view { position: relative; overflow: hidden;
  -webkit-mask-image: linear-gradient(transparent, #000 calc(4 * var(--u)), #000 calc(100% - 6 * var(--u)), transparent);
          mask-image: linear-gradient(transparent, #000 calc(4 * var(--u)), #000 calc(100% - 6 * var(--u)), transparent); }
.reel { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.view.still .reel { position: static; }
.copy { padding: calc(3.5 * var(--u)) calc(4 * var(--u)) calc(4 * var(--u)); display: grid; gap: calc(2.4 * var(--u)); }
.copy + .copy { padding-top: calc(2 * var(--u)); }
h2 { margin: calc(1 * var(--u)) 0 0; font-family: var(--f-display); font-weight: 400; font-size: calc(3.6 * var(--u)); color: var(--gold); letter-spacing: .02em; }
h2 small { font-family: var(--f-mono); font-size: calc(1.9 * var(--u)); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-left: calc(1.5 * var(--u)); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(2 * var(--u)); }

.award, .ub { background: var(--panel); border: 2px solid var(--line); border-radius: calc(2 * var(--u)); padding: calc(2.2 * var(--u)) calc(2.6 * var(--u)); min-width: 0; }
.award { display: grid; gap: calc(.5 * var(--u)); align-content: start; }
.award.headline { border-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), var(--panel) 75%); }
.award .label { font-family: var(--f-mono); font-size: calc(2 * var(--u)); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: calc(1 * var(--u)); }
.ic { font-size: calc(3.4 * var(--u)); line-height: 1; letter-spacing: 0; }
.award .who { font-size: calc(4.4 * var(--u)); font-weight: 800; line-height: 1.1; overflow-wrap: break-word; }
.award .what { color: var(--muted); font-size: calc(2.5 * var(--u)); line-height: 1.25; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.award .stat { font-family: var(--f-mono); font-size: calc(2.3 * var(--u)); color: var(--hot); }

.ub { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(.4 * var(--u)) calc(2 * var(--u)); align-items: center; }
.ub .ic { font-size: calc(6 * var(--u)); grid-row: span 3; }
.ub .nm { font-size: calc(3.2 * var(--u)); font-weight: 800; line-height: 1.1; }
.ub .ds { color: var(--muted); font-size: calc(2.2 * var(--u)); }
.ub .hd { color: var(--hot); font-weight: 700; font-size: calc(2.7 * var(--u)); line-height: 1.2; overflow-wrap: anywhere; }
.ub.debut { border-style: dashed; border-color: var(--hot); }

/* leaderboards */
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(2 * var(--u)) calc(3 * var(--u)); align-items: start; }
.cols > div { display: grid; gap: calc(1.6 * var(--u)); min-width: 0; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(1 * var(--u)); }
.rank li { display: grid; grid-template-columns: calc(5 * var(--u)) minmax(0, 1fr) auto; align-items: baseline; gap: calc(1.6 * var(--u));
  background: var(--panel); border: 2px solid var(--line); border-radius: calc(1.4 * var(--u)); padding: calc(1.2 * var(--u)) calc(2.2 * var(--u)); }
.rank:not(.cont) li:first-child { border-color: var(--gold); background: linear-gradient(90deg, var(--gold-soft), var(--panel) 70%); }
.rank .n { font-family: var(--f-display); font-size: calc(3 * var(--u)); color: var(--gold); }
.rank .nm { font-size: calc(3.2 * var(--u)); font-weight: 800; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .nm small { display: block; font-size: calc(2.1 * var(--u)); font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.rank .v { font-family: var(--f-mono); font-size: calc(2.4 * var(--u)); color: var(--hot); white-space: nowrap; }
h3 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: calc(2.2 * var(--u)); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* live reactions: phones' emoji taps float up the side of the screen */
.rx-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
.rx-fly { position: absolute; bottom: -10vh; font-size: calc(7 * var(--u)); will-change: transform, opacity; animation: rxup 4.2s ease-out forwards; }
@keyframes rxup { 0% { transform: translate(0, 0) scale(.7); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx), -95vh) scale(1.25); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .rx-layer { display: none; } }
.rxnote { font-size: calc(2.2 * var(--u)); color: var(--muted); margin: 0; }

/* bar charts: decade mix and songs by hour */
.chart { background: var(--panel); border: 2px solid var(--line); border-radius: calc(2 * var(--u)); padding: calc(2.4 * var(--u)) calc(2.6 * var(--u)) calc(1.6 * var(--u)); }
.bars { display: flex; align-items: flex-end; gap: calc(1.2 * var(--u)); height: calc(26 * var(--u)); }
.bars .b { flex: 1 1 0; display: grid; grid-template-rows: auto 1fr; justify-items: center; height: 100%; min-width: 0; }
.bars .b span { font-family: var(--f-mono); font-size: calc(2.2 * var(--u)); color: var(--ink); align-self: end; margin-bottom: calc(.6 * var(--u)); }
.bars .b i { display: block; width: 100%; align-self: end; border-radius: calc(.8 * var(--u)) calc(.8 * var(--u)) 0 0; background: var(--hot); min-height: 3px; }
.bars .b.top i { background: var(--gold); }
.axis { display: flex; gap: calc(1.2 * var(--u)); border-top: 2px solid var(--line); padding-top: calc(.8 * var(--u)); }
.axis span { flex: 1 1 0; text-align: center; font-family: var(--f-mono); font-size: calc(2 * var(--u)); color: var(--muted); min-width: 0; white-space: nowrap; }

/* dares */
.dare { background: var(--panel); border: 2px dashed var(--gold); border-radius: calc(2 * var(--u)); padding: calc(2 * var(--u)) calc(2.6 * var(--u)); display: grid; gap: calc(.6 * var(--u)); }
.dare .st { font-family: var(--f-mono); font-size: calc(2 * var(--u)); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.dare .tx { font-size: calc(3.2 * var(--u)); font-weight: 800; line-height: 1.15; }
.dare .by { font-size: calc(2.4 * var(--u)); color: var(--muted); }
.dare.done { border-style: solid; border-color: var(--hot); background: var(--hot-soft); }
.dare.done .st { color: var(--hot); }
.dare.done .by { color: var(--ink); }

/* full screen button: shows when the mouse moves or the screen is tapped */
.fs { position: fixed; left: calc(2 * var(--u)); bottom: calc(1.6 * var(--u)); z-index: 5; font: 700 calc(2.2 * var(--u)) var(--f-body); color: #1a0710;
  background: var(--hot); border: 0; border-radius: calc(1.2 * var(--u)); padding: calc(1.2 * var(--u)) calc(2.2 * var(--u)); cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity .3s; }
body.awake { cursor: default; }
body.awake .fs { opacity: 1; pointer-events: auto; }

.empty { font-size: calc(3.4 * var(--u)); color: var(--muted); text-align: center; padding: calc(20 * var(--u)) calc(6 * var(--u)); }
.status { position: fixed; right: calc(2 * var(--u)); bottom: calc(1.4 * var(--u)); font-family: var(--f-mono); font-size: calc(1.5 * var(--u)); color: var(--muted); opacity: .7; }
.status.bad { color: var(--hot); opacity: 1; }

/* Narrow or portrait screens (a laptop window, a vertical TV): fewer columns, drop the tally. */
@media (max-aspect-ratio: 4/3) { :root { --u: .75vw; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols { grid-template-columns: minmax(0, 1fr); } header { grid-template-columns: minmax(0, 1fr) auto; } .tally { display: none; } }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">Oke <span>Night</span></div>
    <div class="title" id="title">Loading the awards…</div>
    <div class="kicker" id="kicker"></div>
  </div>
  <div class="tally" id="tally"></div>
  <div class="qr"><div class="code" id="qr"></div><small id="host">okenight.com</small></div>
</header>
<div class="view" id="view"><div class="reel" id="reel"></div></div>
<div class="status" id="status"></div>
<div class="rx-layer" id="rx-layer" aria-hidden="true"></div>
<button class="fs" id="fs" type="button" hidden>⛶ Full screen</button>

<script src="/fun.js"></script>
<script src="/awards.js"></script>
<script>
(function () {
  // Options: ?night=YYYY-MM-DD shows that night instead of the latest one; ?speed=2 scrolls twice as fast (0.2 to 5).
  const qs = new URLSearchParams(location.search);
  const PIN = /^\d{4}-\d{2}-\d{2}$/.test(qs.get("night") || "") ? qs.get("night") : null;
  const SPEED = Math.max(0.2, Math.min(5, Number(qs.get("speed")) || 1)); // 1 = about 3.5% of the screen height per second
  const REFRESH_MS = 60000;
  const LIVE_WINDOW_S = 45 * 60, TONIGHT_WINDOW_S = 10 * 3600;

  const $ = (id) => document.getElementById(id);
  const key = (s) => (s || "").trim().toLowerCase();
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  const nightLabel = (n) => new Date(n + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  const names = (list, max) => list.slice(0, max).join(", ") + (list.length > max ? " and " + (list.length - max) + " more" : "");
  let clockSkew = 0, lastView = "";
  const now = () => Date.now() / 1000 + clockSkew;

  // ---------- data -> what to show ----------
  function build(data) {
    const plays = data.plays.map((p) => ({ ...p, played_at: Number(p.played_at), length_s: p.length_s ? Number(p.length_s) : null, release_year: p.release_year ? Number(p.release_year) : null }))
      .sort((a, b) => a.played_at - b.played_at);
    if (window.KaraokeFun) KaraokeFun.canonicalize(plays);
    const nights = [...new Set(plays.map((p) => p.night).filter(Boolean))].sort();
    const night = PIN && nights.includes(PIN) ? PIN : nights[nights.length - 1];
    if (!night) return null;
    const rows = plays.filter((p) => p.night === night);
    const last = plays[plays.length - 1];
    const isLatest = night === nights[nights.length - 1];
    const live = isLatest && now() - last.played_at < LIVE_WINDOW_S;
    const tonight = isLatest && now() - last.played_at < TONIGHT_WINDOW_S;
    const reax = OkeAwards.reactionIndex(data);
    const people = window.KaraokeFun ? KaraokeFun.badgesAll(plays, tonight ? night : null, reax.bySong) : null;
    const totals = (r) => OkeAwards.personTotals(r, people, plays);
    const awards = OkeAwards.awardsFor(rows, totals, reax).sort((a, b) => !!b.headline - !!a.headline);
    // Crowd reactions for the night: totals per emoji and the most-reacted songs
    const rxTot = {}; const rxSongs = [];
    rows.forEach((p) => { const c = p.uuid && reax.bySong.get(p.uuid); if (!c) return; Object.entries(c).forEach(([k, n]) => { rxTot[k] = (rxTot[k] || 0) + n; });
      rxSongs.push({ name: (p.singer || "Someone").trim(), sub: p.title ? "“" + p.title + "”" : "", n: OkeAwards.sumOf(c),
        top: Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => (OkeAwards.REACTIONS.find((x) => x.k === k) || { e: "" }).e + n).join(" ") }); });
    const reactions = OkeAwards.REACTIONS.filter((x) => rxTot[x.k]).map((x) => ({ label: x.e, n: rxTot[x.k] }));
    const topReacted = rxSongs.sort((a, b) => b.n - a.n).slice(0, 6);
    // The song on the mic right now, so phones' reactions can float up the screen
    const singing = live && last.uuid && now() - last.played_at < (last.length_s || 300) + 180;
    // Badges first earned this night, one card per badge with everyone who got it. First-timers get their own card.
    const groups = new Map();
    if (people) KaraokeFun.unlockedOn(people, night).slice().reverse().forEach((u) => {
      const g = groups.get(u.badge.id) || { id: u.badge.id, name: u.badge.name, desc: u.badge.desc, who: [] };
      if (!g.who.includes(u.who)) g.who.push(u.who); groups.set(u.badge.id, g); });
    const badges = [...groups.values()].sort((a, b) => b.who.length - a.who.length);
    const debut = [];
    if (people) people.forEach((e) => { const d = e.badges.find((b) => b.id === "debut"); if (d && d.at.night === night) debut.push(e.name); });
    if (debut.length) badges.push({ id: "debut", name: "First time on the mic", desc: "Welcome to Oke Night!", who: debut });
    // Leaderboards for the night
    const singers = totals(rows).slice(0, 8).map((e) => ({ name: e.name, n: e.n, mins: Math.round(e.secs / 60) }));
    const count = (keyOf, label) => { const m = new Map(); rows.forEach((p) => { const k = keyOf(p); if (!k) return; const e = m.get(k) || { ...label(p), n: 0, who: new Set() }; e.n++; e.who.add(p.singer); m.set(k, e); });
      return [...m.values()].sort((a, b) => b.n - a.n || b.who.size - a.who.size); };
    const songs = count((p) => p.title && key(p.title), (p) => ({ name: p.title, sub: p.artist || "" })).filter((e) => e.n > 1).slice(0, 6);
    const artists = count((p) => p.artist && key(p.artist), (p) => ({ name: p.artist })).filter((e) => e.n > 1).slice(0, 6);
    // Decade mix and songs by hour (hours in the order the night ran, so 9pm comes before 1am)
    const dec = new Map(); rows.forEach((p) => { if (p.release_year) { const d = Math.floor(p.release_year / 10) * 10; dec.set(d, (dec.get(d) || 0) + 1); } });
    const decades = [...dec.entries()].sort((a, b) => a[0] - b[0]).map(([d, n]) => ({ label: "’" + String(d).slice(2) + "s", n }));
    const hrs = new Map(); rows.forEach((p) => { const h = new Date(p.played_at * 1000).getHours(); hrs.set(h, (hrs.get(h) || 0) + 1); });
    const hours = [...hrs.entries()].map(([h, n]) => ({ label: (h % 12 || 12) + (h < 12 ? "am" : "pm"), n }));
    const dares = window.KaraokeFun ? KaraokeFun.daresStatus(plays, night).map((d) => ({ text: d.text, by: d.claimedBy ? (d.claimedBy.singer || "Someone").trim() : null,
      song: d.claimedBy ? OkeAwards.songLine(d.claimedBy) : null })) : [];
    return { night, live, tonight, isLatest, tally: OkeAwards.tallyFor(rows), awards, badges, nBadges: [...groups.values()].reduce((a, g) => a + g.who.length, 0),
      singers, songs, artists, decades, hours, dares, reactions, topReacted, current: singing ? last.uuid : null, schedule: data.schedule || null };
  }

  // ---------- render ----------
  function awardCard(a) {
    const c = el("article", "award" + (a.headline ? " headline" : ""));
    const lb = el("div", "label"); const ic = el("span", "ic", OkeAwards.icon(a.id)); ic.setAttribute("aria-hidden", "true");
    lb.append(ic, document.createTextNode(a.label));
    c.append(lb, el("div", "who", a.who.replace(/\//g, "/\u200b")), el("div", "what", a.what), el("div", "stat", a.stat));
    return c;
  }
  function badgeCard(g) {
    const c = el("article", "ub" + (g.id === "debut" ? " debut" : ""));
    const ic = el("span", "ic", OkeAwards.icon(g.id)); ic.setAttribute("aria-hidden", "true");
    c.append(ic, el("div", "nm", g.name), el("div", "ds", g.desc), el("div", "hd", names(g.who, 8)));
    return c;
  }
  function heading(text, aside) { const h = el("h2", null, text); if (aside) h.append(el("small", null, aside)); return h; }
  function rankList(items, sub, val) {
    const ol = el("ol", "rank");
    items.forEach((e, i) => { const li = el("li"); const nm = el("div", "nm", e.name); const s = sub(e); if (s) nm.append(el("small", null, s));
      li.append(el("span", "n", String(i + 1)), nm, el("span", "v", val(e))); ol.append(li); });
    return ol;
  }
  // One ranked list split across two columns, numbered straight through.
  function twoCols(items, sub, val) {
    const half = Math.ceil(items.length / 2), cols = el("div", "cols"), a = el("div"), b = el("div");
    a.append(rankList(items.slice(0, half), sub, val));
    const rest = rankList(items.slice(half), sub, val); rest.classList.add("cont");
    [...rest.children].forEach((li, i) => { li.firstChild.textContent = String(half + i + 1); });
    b.append(rest); cols.append(a, b); return cols;
  }
  function barChart(title, items) {
    const box = el("div", "chart"), max = Math.max(1, ...items.map((x) => x.n)), bars = el("div", "bars"), axis = el("div", "axis");
    items.forEach((x) => { const b = el("div", "b" + (x.n === max ? " top" : "")); const bar = el("i"); bar.style.height = Math.max(2, (100 * x.n) / max) + "%";
      b.append(el("span", null, String(x.n)), bar); bars.append(b); axis.append(el("span", null, x.label)); });
    const wrap = el("div"); wrap.append(el("h3", null, title), box); box.append(bars, axis); return wrap;
  }
  function copyOf(v) {
    const box = el("div", "copy");
    const h1 = el("h2", null, v.tonight ? "Tonight's awards" : "The awards"); h1.append(el("small", null, plural(v.awards.length, "winner")));
    const g1 = el("div", "grid"); v.awards.forEach((a) => g1.append(awardCard(a)));
    box.append(h1, g1);
    if (v.singers.length) {
      box.append(heading(v.tonight ? "Tonight's top singers" : "Top singers", plural(v.tally.singers, "singer") + " in all"));
      box.append(twoCols(v.singers, (e) => (e.mins ? e.mins + " min on the mic" : ""), (e) => plural(e.n, "song")));
    }
    if (v.reactions.length) {
      box.append(heading(v.tonight ? "Crowd reactions tonight" : "Crowd reactions", v.reactions.reduce((a, x) => a + x.n, 0) + " taps from the crowd"));
      const cols = el("div", "cols");
      cols.append(barChart("Every emoji", v.reactions));
      if (v.topReacted.length) { const c = el("div"); c.append(el("h3", null, "Most-reacted songs"), rankList(v.topReacted, (e) => e.sub, (e) => e.top)); cols.append(c); }
      box.append(cols);
    } else if (v.tonight) {
      box.append(heading("React from your phone"), el("p", "rxnote", "Open " + (location.host || "okenight.com") + " and tap 🔥 🎤 🍅 😴 on whoever is singing. The crowd’s reactions decide some of tonight’s awards."));
    }
    if (v.badges.length) {
      const h2 = el("h2", null, v.tonight ? "Badges unlocked tonight" : "Badges unlocked"); h2.append(el("small", null, plural(v.nBadges, "badge") + " earned"));
      const g2 = el("div", "grid"); v.badges.forEach((b) => g2.append(badgeCard(b)));
      box.append(h2, g2);
    }
    if (v.songs.length || v.artists.length) {
      box.append(heading("Crowd favorites"));
      const lists = [];
      if (v.songs.length) lists.push(["Most-sung songs", v.songs, (e) => e.sub, (e) => e.n + "×"]);
      if (v.artists.length) lists.push(["Top artists", v.artists, (e) => plural(e.who.size, "singer"), (e) => plural(e.n, "song")]);
      if (lists.length === 1) { const [t, items, sub, val] = lists[0]; box.append(el("h3", null, t)); box.append(twoCols(items, sub, val)); }
      else { const cols = el("div", "cols"); lists.forEach(([t, items, sub, val]) => { const c = el("div"); c.append(el("h3", null, t), rankList(items, sub, val)); cols.append(c); }); box.append(cols); }
    }
    if (v.decades.length > 1 || v.hours.length > 1) {
      box.append(heading("The night in numbers"));
      const cols = el("div", "cols");
      if (v.decades.length > 1) cols.append(barChart("Songs by decade", v.decades));
      if (v.hours.length > 1) cols.append(barChart("Songs by hour", v.hours));
      box.append(cols);
    }
    if (v.dares.length) {
      box.append(heading(v.tonight ? "Tonight's dares" : "The dares", v.dares.filter((d) => d.by).length + " of " + v.dares.length + " claimed"));
      const g = el("div", "grid");
      v.dares.forEach((d) => { const c = el("article", "dare" + (d.by ? " done" : ""));
        c.append(el("div", "st", d.by ? "Claimed" : v.tonight ? "Still open" : "Nobody took it"), el("div", "tx", d.text),
          el("div", "by", d.by ? d.by + " with " + d.song : v.tonight ? "First one to do it gets the glory." : "Maybe next time."));
        g.append(c); });
      box.append(g);
    }
    return box;
  }
  function render(v) {
    $("title").textContent = v.tonight ? "Tonight · " + nightLabel(v.night) : nightLabel(v.night);
    const k = $("kicker"); k.classList.toggle("live", v.live);
    const sc = v.schedule, at = sc && sc.venue ? " at " + sc.venue : "";
    k.textContent = v.live ? "Live" + at + " · updating as you sing" : v.tonight ? "Tonight so far" + at
      : v.isLatest && sc && sc.status !== "off" ? "Starting soon" + at : !v.isLatest ? "Karaoke night" : sc && sc.next_label ? "Next karaoke: " + sc.next_label + at : "The latest karaoke night";
    const t = $("tally"); t.replaceChildren();
    [["Songs", v.tally.songs], ["Singers", v.tally.singers], ["Minutes", v.tally.minutes]].forEach(([l, n]) => {
      const d = el("div"); d.append(el("strong", null, String(n)), document.createTextNode(l)); t.append(d); });
    const reel = $("reel"); reel.replaceChildren();
    if (!v.awards.length) { reel.append(el("div", "empty", "Awards show up once a few songs are in. Grab the mic!")); }
    else reel.append(copyOf(v));
    layout();
  }

  // ---------- endless scroll ----------
  // If everything fits, it sits still. Otherwise a second copy goes underneath and the reel slides up by one
  // copy's height, then wraps, so it loops with no jump.
  let offset = 0, span = 0, lastT = 0, pauseUntil = 0;
  function layout() {
    const view = $("view"), reel = $("reel");
    [...reel.querySelectorAll(".copy.dup")].forEach((d) => d.remove());
    const first = reel.firstElementChild;
    const fits = !first || first.offsetHeight <= view.clientHeight;
    view.classList.toggle("still", fits);
    if (fits) { span = 0; offset = 0; reel.style.transform = ""; return; }
    const dup = first.cloneNode(true); dup.classList.add("dup"); dup.setAttribute("aria-hidden", "true"); reel.append(dup);
    span = dup.offsetTop - first.offsetTop;
    offset = offset % span;
    if (!pauseUntil) pauseUntil = performance.now() + 4000; // let people read the top before it moves
  }
  function tick(t) {
    const dt = lastT ? Math.min(100, t - lastT) : 0; lastT = t;
    if (span && t > pauseUntil) {
      offset += (dt / 1000) * window.innerHeight * 0.035 * SPEED;
      if (offset >= span) { offset -= span; pauseUntil = t + 4000; }
      $("reel").style.transform = "translate3d(0," + (-offset).toFixed(1) + "px,0)";
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 200); });

  // ---------- refresh ----------
  function setStatus(msg, bad) { const s = $("status"); s.textContent = msg; s.classList.toggle("bad", !!bad); }
  async function refresh() {
    try {
      const r = await fetch("/api/plays", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const text = await r.text(); const data = JSON.parse(text);
      if (data.served_at) clockSkew = data.served_at - Date.now() / 1000;
      const v = build(data);
      if (!v) { $("title").textContent = "No karaoke nights yet"; return setStatus(""); }
      const sig = JSON.stringify(v); // only redraw when something on screen would change, so the scroll doesn't jump
      if (sig !== lastView) { lastView = sig; render(v); }
      watchRx(v.current);
      setStatus(new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }));
    } catch (e) {
      setStatus(lastView ? "Can't reach the stats right now. Showing what we had." : "Couldn't load the stats. Retrying…", true);
    }
  }

  // ---------- live reactions overlay ----------
  // While a song is on, check its reaction counts every 4s and float up one emoji per new tap (at most 14 at a time).
  let rxPlay = null, rxSeen = null, rxT = 0;
  function watchRx(play) {
    if (play === rxPlay) return;
    rxPlay = play; rxSeen = null; clearTimeout(rxT);
    if (play) pollRx();
  }
  async function pollRx() {
    const play = rxPlay; if (!play) return;
    try {
      const r = await fetch("/api/reactions?play=" + encodeURIComponent(play));
      if (r.ok && play === rxPlay) {
        const c = (await r.json()).counts || {};
        if (rxSeen) { const burst = []; Object.entries(c).forEach(([k, n]) => { for (let i = (rxSeen[k] || 0); i < n && burst.length < 14; i++) burst.push(k); }); burst.forEach((k, i) => setTimeout(() => flyRx(k), i * 180)); }
        rxSeen = { ...(rxSeen || {}), ...c };
      }
    } catch (e) {}
    if (play === rxPlay) rxT = setTimeout(pollRx, 4000);
  }
  function flyRx(k) {
    const x = OkeAwards.REACTIONS.find((r) => r.k === k); if (!x) return;
    const f = el("span", "rx-fly", x.e), side = Math.random() < 0.5;
    f.style.left = (side ? 2 + Math.random() * 12 : 86 + Math.random() * 12) + "vw"; f.style.setProperty("--dx", Math.round(Math.random() * 8 - 4) + "vw");
    $("rx-layer").append(f); setTimeout(() => f.remove(), 4400);
  }

  // ---------- QR so the crowd can open the site on their phones ----------
  $("host").textContent = location.host || "okenight.com";
  function qr() { if (window.QRCode) new QRCode($("qr"), { text: location.origin + "/", width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }); else $("qr").hidden = true; }
  if (document.readyState === "complete") qr(); else window.addEventListener("load", qr);

  // ---------- full screen ----------
  // Browsers only allow full screen after a click or key press, so: move the mouse (or tap) to show the button,
  // or press F, or double-click anywhere. The button hides again after a few seconds.
  const root = document.documentElement, fsBtn = $("fs");
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function toggleFs() {
    if (!canFs) return;
    try {
      if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (r && r.catch) r.catch(() => {}); }
    } catch (e) {}
  }
  function fsLabel() { fsBtn.textContent = isFs() ? "✕ Exit full screen" : "⛶ Full screen"; }
  fsBtn.hidden = !canFs;
  fsBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFs(); });
  document.addEventListener("fullscreenchange", () => { fsLabel(); setTimeout(layout, 300); });
  document.addEventListener("webkitfullscreenchange", () => { fsLabel(); setTimeout(layout, 300); });
  document.addEventListener("dblclick", toggleFs);
  document.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") toggleFs(); });
  let idle; const wakeUi = () => { document.body.classList.add("awake"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.remove("awake"), 3500); };
  ["mousemove", "pointerdown", "touchstart"].forEach((t) => document.addEventListener(t, wakeUi, { passive: true }));

  // Keep the TV awake where the browser allows it.
  async function wake() { try { if (navigator.wakeLock && !document.hidden) await navigator.wakeLock.request("screen"); } catch (e) {} }
  wake(); document.addEventListener("visibilitychange", wake);

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  refresh();
  setInterval(refresh, REFRESH_MS);
  // Reload every 6 hours so a TV left on all week picks up site updates.
  setTimeout(() => location.reload(), 6 * 3600 * 1000);
})();
</script>
</body>
</html>
