# Public, read-only karaoke stats site for phones.
# Deploy from this folder with:  npx wrangler deploy
name = "karaoke-star-bot"  # must match the Worker Cloudflare created from this repo
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Serve the site at okenight.com (the domain must be a zone in this Cloudflare account).
routes = [
  { pattern = "okenight.com", custom_domain = true },
  { pattern = "www.okenight.com", custom_domain = true },
]

# Every minute: check for newly sung secret songs and push the host alert (see src/secrets_api.js).
[triggers]
crons = ["* * * * *"]

# Album cover sources, in order (see src/art_api.js). itunes = Apple, deezer, coverart = Cover Art Archive.
# Apple only: its artwork links back to Apple Music. Deezer and the Cover Art Archive don't license
# their images for commercial use, and the site now takes tips.
[vars]
ART_SOURCES = "itunes"

# Secrets (set in the Cloudflare dashboard, never in this file): HOST_SETUP_CODE, ANTHROPIC_API_KEY,
# IP_SALT (any long random text; keeps rate-limit network hashes from being reversed, see src/net.js).

[[d1_databases]]
binding = "DB"
database_name = "karaoke-stats"
database_id = "61453b2b-22e8-480d-a1ac-a6db72aa29a9"

# Serve bingo.js, fun.js, awards.js, songs.js and drafts.js to browsers as a file instead of bundling it into the Worker.
[[rules]]
type = "Text"
globs = ["**/bingo.js", "**/fun.js", "**/awards.js", "**/songs.js", "**/drafts.js", "**/art.js"]
fallthrough = true
