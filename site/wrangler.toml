# Public, read-only karaoke stats site for phones.
# Deploy from this folder with:  npx wrangler deploy
name = "karaoke-star-bot"  # must match the Worker Cloudflare created from this repo
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Serve the site at okenight.com (the domain must be a zone in this Cloudflare account).
routes = [
  { pattern = "okenight.com", custom_domain = true },
  { pattern = "www.okenight.com", custom_domain = true },
]

# Every minute: check for newly sung secret songs and push the host alert (see src/secrets_api.js).
# CPU time per request / cron run. The weekly song list import unzips and reads ~180 MB of XML, which can
# take more than the default 30 s of CPU; everything else stays far below this.
[limits]
cpu_ms = 300000

[triggers]
crons = ["* * * * *"]

# Album cover sources, in order (see src/art_api.js). itunes = Apple, deezer, coverart = Cover Art Archive.
# Apple only: its artwork links back to Apple Music. Deezer and the Cover Art Archive don't license
# their images for commercial use, and the site now takes tips.
[vars]
ART_SOURCES = "itunes"
# Bar billing on the home page (Stripe Payment Link with a 30-day trial, and the customer portal login).
# Live-mode links (real cards). Leave one empty to hide it.
# Sandbox links (for testing): checkout https://buy.stripe.com/test_00weV6dcMdJ1agI2CKgQE00
#   portal https://billing.stripe.com/p/login/test_00weV6dcMdJ1agI2CKgQE00
STRIPE_CHECKOUT_URL = "https://buy.stripe.com/3cI00kd83b8vfSS0YPg7e01"
STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/28EcN69VRcczeOO22Tg7e00"

# Secrets (set in the Cloudflare dashboard, never in this file): HOST_SETUP_CODE, ANTHROPIC_API_KEY,
# IP_SALT (any long random text; keeps rate-limit network hashes from being reversed, see src/net.js).

# Workers AI: the singer photo "rock-star looks" (src/styled_api.js, FLUX.2 klein, about $0.0004 a look).
[ai]
binding = "AI"

# Where rock-star looks are stored. Until R2 is switched on for the account (Cloudflare dashboard > R2 >
# Purchase/enable, the first 10 GB are free) and a bucket called okenight-styled exists, leave this commented
# out and the looks are kept in D1 instead. Then uncomment it and deploy.
# [[r2_buckets]]
# binding = "STYLED"
# bucket_name = "okenight-styled"

[[d1_databases]]
binding = "DB"
database_name = "karaoke-stats"
database_id = "61453b2b-22e8-480d-a1ac-a6db72aa29a9"

# Serve bingo.js, fun.js, awards.js, songs.js and drafts.js to browsers as a file instead of bundling it into the Worker.
[[rules]]
type = "Text"
globs = ["**/bingo.js", "**/fun.js", "**/awards.js", "**/songs.js", "**/drafts.js", "**/art.js", "**/duets.js", "**/picker.js", "**/pwa/sw.js", "**/*.webmanifest"]
fallthrough = true

# App icons (src/pwa/*.png), served as-is by the Worker.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
