# Builds the Oke Night iPhone app (app/) on a GitHub cloud Mac.
#
#  - Pull requests that touch the app: a quick build for the iPhone simulator, to check that it compiles.
#  - "Run workflow" (Actions tab > iPhone app > Run workflow): a signed App Store build, uploaded to
#    App Store Connect, where it shows up in TestFlight after Apple processes it (about 10-30 minutes).
#
# The upload needs four repository secrets (Settings > Secrets and variables > Actions), from App Store
# Connect > Users and Access > Integrations > App Store Connect API (key role: Admin, so Xcode can make
# the signing certificate and profile itself):
#   APPLE_TEAM_ID       the 10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID          the API key's Key ID
#   ASC_ISSUER_ID       the Issuer ID shown above the keys list
#   ASC_KEY_P8          the contents of the downloaded AuthKey_XXXX.p8 file (the whole text)
# Without them the run stops after the simulator build and says what's missing.
name: iPhone app

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect / TestFlight"
        type: boolean
        default: true
  pull_request:
    paths:
      - "app/**"
      - "site/src/index.html"
      - "site/src/*.js"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the app's web files and copy them into the iPhone project
        working-directory: app
        env:
          # Firebase config for push (base64 of GoogleService-Info.plist). Empty = the app builds without push.
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
        run: |
          npm ci
          npm run check
          npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Simulator build (compile check, no signing)
        if: github.event_name == 'pull_request' || !inputs.upload
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Check the upload secrets
        id: secrets
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::warning::Not uploading: add these repository secrets first:$missing (see the top of .github/workflows/ios-testflight.yml)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive, sign and upload to App Store Connect
        if: steps.secrets.outputs.ok == 'true'
        working-directory: app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Write the key file cleanly however the secret was pasted: Windows line endings, extra spaces,
          # missing BEGIN/END lines, or the file base64-encoded. Prints only its shape, never the key.
          KEY="$KEY" python3 - <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].replace("\r", "").strip()
          if "PRIVATE KEY" not in raw:
              try:
                  dec = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("utf-8", "strict")
                  if "PRIVATE KEY" in dec: raw = dec.replace("\r", "").strip()
              except Exception: pass
          had_header = "BEGIN PRIVATE KEY" in raw
          body = re.sub(r"-----[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          print("ASC_KEY_P8 shape: header %s, %d key characters" % ("yes" if had_header else "no", len(body)))
          try: der = base64.b64decode(body, validate=True)
          except Exception: der = b""
          if not (100 <= len(der) <= 400 and der[:1] == b"\x30"):
              print("::error::ASC_KEY_P8 is not the contents of an AuthKey_XXXX.p8 file. Open the .p8 file in Notepad, copy all of it and save the secret again.")
              sys.exit(1)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          open(os.environ["KEY"], "w", newline="\n").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          PY
          # Ask Apple directly whether this key, Key ID and Issuer ID work together, so a wrong secret is
          # named here instead of as a vague signing error later. Prints only the answer's status.
          KEY="$KEY" python3 - <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.request, urllib.error
          b64 = lambda b: base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          head = b64(json.dumps({"alg": "ES256", "kid": os.environ["ASC_KEY_ID"], "typ": "JWT"}).encode())
          now = int(time.time())
          body = b64(json.dumps({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}).encode())
          der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", os.environ["KEY"]], input=(head + "." + body).encode(), capture_output=True, check=True).stdout
          def ints(d):  # DER ECDSA signature -> the two 32-byte numbers a JWT wants
              i = 2 + (d[1] & 0x7f if d[1] & 0x80 else 0); out = []
              for _ in range(2):
                  n = d[i + 1]; out.append(d[i + 2:i + 2 + n].lstrip(b"\0").rjust(32, b"\0")); i += 2 + n
              return b"".join(out)
          tok = head + "." + body + "." + b64(ints(der))
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1&fields[apps]=bundleId", headers={"Authorization": "Bearer " + tok})
          try:
              with urllib.request.urlopen(req, timeout=30) as r: print("App Store Connect key check: OK (%d)" % r.status)
          except urllib.error.HTTPError as e:
              print("App Store Connect key check: Apple answered %d" % e.code)
              if e.code == 401:
                  print("::error::Apple rejected the API key. ASC_KEY_P8 must be the AuthKey_<ASC_KEY_ID>.p8 file from App Store Connect > Users and Access > Integrations (not the push notification key), and ASC_KEY_ID / ASC_ISSUER_ID must be from that same page.")
                  sys.exit(1)
          except Exception as e:
              print("App Store Connect key check: could not reach Apple (%s), carrying on" % type(e).__name__)
          PY
          # Build number: the run number, so every upload is new. Version (1.0) comes from the project.
          BUILD="${{ github.run_number }}"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # 1. Archive without Apple signing. (Automatic signing would first want a development profile,
          #    which needs a registered test iPhone on the team.)
          ARCHIVE="$RUNNER_TEMP/OkeNight.xcarchive"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -n 40
          # 2. Give the archived app a local (ad-hoc) signature that carries its entitlements, so the export
          #    below keeps Push Notifications when it re-signs for the App Store.
          APP="$ARCHIVE/Products/Applications/App.app"
          ENT="$RUNNER_TEMP/archive.entitlements"
          cp App/App.entitlements "$ENT"
          /usr/libexec/PlistBuddy -c "Add :application-identifier string $APPLE_TEAM_ID.com.okenight.app" \
            -c "Add :com.apple.developer.team-identifier string $APPLE_TEAM_ID" "$ENT"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 | xargs -0 -n1 codesign --force --sign -
          fi
          codesign --force --sign - --entitlements "$ENT" "$APP"
          # 3. Export: Xcode makes the App Store certificate and profile itself (API key, Admin role) and signs.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          # 4. Check the signed app before uploading: App Store signature, with production push.
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP/ipa/Payload/App.app" > "$RUNNER_TEMP/signed.entitlements" 2>/dev/null
          codesign -dv "$RUNNER_TEMP/ipa/Payload/App.app" 2>&1 | grep -E "Authority|TeamIdentifier" | head -n 3
          PUSH="$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$RUNNER_TEMP/signed.entitlements" 2>/dev/null || true)"
          echo "Push entitlement in the signed app: ${PUSH:-missing}"
          if [ "$PUSH" != "production" ]; then
            echo "::error::The signed app has no production Push Notifications entitlement, so it was not uploaded."
            exit 1
          fi
          # 5. Upload to App Store Connect.
          mkdir -p "$HOME/.appstoreconnect/private_keys" && cp "$KEY" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -n 20
          rm -rf "$HOME/.appstoreconnect/private_keys"
          echo "### Uploaded build 1.0 ($BUILD) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight once Apple finishes processing it." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KEY"
