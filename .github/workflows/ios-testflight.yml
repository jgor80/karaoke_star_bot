# Builds the Oke Night iPhone app (app/) on a GitHub cloud Mac.
#
#  - Pull requests that touch the app: a quick build for the iPhone simulator, to check that it compiles.
#  - "Run workflow" (Actions tab > iPhone app > Run workflow): a signed App Store build, uploaded to
#    App Store Connect, where it shows up in TestFlight after Apple processes it (about 10-30 minutes).
#
# The upload needs four repository secrets (Settings > Secrets and variables > Actions), from App Store
# Connect > Users and Access > Integrations > App Store Connect API (key role: Admin, so Xcode can make
# the signing certificate and profile itself):
#   APPLE_TEAM_ID       the 10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID          the API key's Key ID
#   ASC_ISSUER_ID       the Issuer ID shown above the keys list
#   ASC_KEY_P8          the contents of the downloaded AuthKey_XXXX.p8 file (the whole text)
# Without them the run stops after the simulator build and says what's missing.
name: iPhone app

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect / TestFlight"
        type: boolean
        default: true
  pull_request:
    paths:
      - "app/**"
      - "site/src/index.html"
      - "site/src/*.js"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the app's web files and copy them into the iPhone project
        working-directory: app
        env:
          # Firebase config for push (base64 of GoogleService-Info.plist). Empty = the app builds without push.
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
        run: |
          npm ci
          npm run check
          npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Simulator build (compile check, no signing)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Check the upload secrets
        id: secrets
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::warning::Not uploading: add these repository secrets first:$missing (see the top of .github/workflows/ios-testflight.yml)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive, sign and upload to App Store Connect
        if: steps.secrets.outputs.ok == 'true'
        working-directory: app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Write the key file cleanly however the secret was pasted: Windows line endings, extra spaces,
          # missing BEGIN/END lines, or the file base64-encoded. Prints only its shape, never the key.
          KEY="$KEY" python3 - <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].replace("\r", "").strip()
          if "PRIVATE KEY" not in raw:
              try:
                  dec = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("utf-8", "strict")
                  if "PRIVATE KEY" in dec: raw = dec.replace("\r", "").strip()
              except Exception: pass
          had_header = "BEGIN PRIVATE KEY" in raw
          body = re.sub(r"-----[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          print("ASC_KEY_P8 shape: header %s, %d key characters" % ("yes" if had_header else "no", len(body)))
          try: der = base64.b64decode(body, validate=True)
          except Exception: der = b""
          if not (100 <= len(der) <= 400 and der[:1] == b"\x30"):
              print("::error::ASC_KEY_P8 is not the contents of an AuthKey_XXXX.p8 file. Open the .p8 file in Notepad, copy all of it and save the secret again.")
              sys.exit(1)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          open(os.environ["KEY"], "w", newline="\n").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          PY
          # Build number: the run number, so every upload is new. Version (1.0) comes from the project.
          BUILD="${{ github.run_number }}"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OkeNight.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" archive | tail -n 60
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OkeNight.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 60
          echo "### Uploaded build 1.0 ($BUILD) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight once Apple finishes processing it." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KEY"
